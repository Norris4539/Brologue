<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ede0c8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brologue">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Brologue — Train. Track. Triumph.</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --paper:#ede0c8; --paper2:#f4ead6; --ink:#2b2016; --red:#b3311c; --red2:#8f2210;
    --tan:#8a6f4d; --faded:#6e5b41; --pale:#c4b294; --line:#d8c9a8;
    --wood:Haettenschweiler,Impact,'Arial Narrow Bold','Arial Narrow',sans-serif;
    --serif:Georgia,'Times New Roman',serif;
    --small:Verdana,Geneva,sans-serif;
    --sab:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);overscroll-behavior-y:none;color-scheme:light}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(43,32,22,.055) 1px,transparent 1px);background-size:4px 4px}
  button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  #app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;z-index:1}
  .screen{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .scrolly{flex:1;overflow-y:auto;padding:14px 16px calc(20px + var(--sab));min-height:0}

  /* app bar + masthead */
  .app-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;
    border-bottom:3px double var(--ink);margin:0 16px;padding-left:0;padding-right:0}
  .app-bar .title{font-family:var(--wood);font-size:26px;letter-spacing:1.5px;text-transform:uppercase;line-height:1}
  .brand{font-family:var(--wood);font-size:26px;letter-spacing:2px;text-transform:uppercase;color:var(--ink);line-height:1}
  .brand em{font-style:normal;color:var(--red)}
  .icon-btn{font-size:19px;padding:6px 8px;color:var(--faded)}
  .icon-btn:active{background:rgba(43,32,22,.08)}
  .mast{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--faded);
    font-family:var(--small);font-size:8.5px;letter-spacing:2px;font-weight:700;text-transform:uppercase;padding:10px 0 4px}

  /* kick / heading */
  .kick{color:var(--red);font-size:10px;letter-spacing:3px;font-weight:800;text-transform:uppercase;font-family:var(--small)}
  .h1{font-family:var(--wood);font-size:38px;letter-spacing:1px;text-transform:uppercase;line-height:.92;margin-top:4px}
  .meta{color:var(--faded);font-size:12.5px;margin-top:4px;font-style:italic}
  .sl{color:var(--faded);font-size:10px;letter-spacing:3px;font-weight:800;text-transform:uppercase;margin:20px 2px 8px;
    font-family:var(--small);display:flex;align-items:center;gap:8px}
  .sl::after{content:'';flex:1;border-top:1px solid var(--ink)}

  /* motivation row */
  .mot{display:flex;align-items:center;gap:9px;margin-top:10px;flex-wrap:wrap}
  .streak{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;background:var(--ink);color:var(--paper);
    font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;font-family:var(--small)}
  .streak.cold{background:transparent;color:var(--faded);border:1.5px solid var(--ink)}
  .quote{color:var(--tan);font-size:12.5px;font-style:italic}

  /* cards — double-rule newsprint boxes */
  .card{background:var(--paper2);border:1.5px solid var(--ink);outline:1px solid var(--ink);outline-offset:3px;
    padding:9px 14px;margin:14px 4px 6px}
  .exrow{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:8px 0;border-bottom:1px dotted var(--tan)}
  .exrow:last-child{border-bottom:0}
  .exrow .set{font-family:var(--wood);font-size:17px;letter-spacing:1px;color:var(--red);white-space:nowrap;margin-left:10px}
  .cta{display:block;width:100%;background:var(--red);color:var(--paper);text-align:center;font-family:var(--wood);
    font-size:19px;letter-spacing:3px;padding:13px;margin-top:16px;text-transform:uppercase;
    border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
  .cta:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .cta.ghost{background:var(--paper2);color:var(--ink)}
  .empty{color:var(--faded);font-size:13.5px;text-align:center;padding:22px 10px;line-height:1.65;font-style:italic}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;font-size:11px;font-weight:700;
    background:var(--paper2);border:1.5px solid var(--ink);color:var(--ink);font-family:var(--small);letter-spacing:.5px;text-transform:uppercase}
  .chip.on{background:var(--ink);color:var(--paper)}
  .chiprow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}

  /* calendar: segmented + bar (Dokit layout) */
  .cal-seg{display:flex;border:1.5px solid var(--ink);margin:12px 16px 0;background:var(--paper2)}
  .cal-seg button{flex:1;padding:8px 0;font-family:var(--wood);font-size:14px;letter-spacing:2px;color:var(--faded);
    text-transform:uppercase;border-right:1.5px solid var(--ink)}
  .cal-seg button:last-child{border-right:0}
  .cal-seg button.on{background:var(--ink);color:var(--paper)}
  /* mini month (Today screen) */
  .mini-cal{background:var(--paper2);border:1.5px solid var(--ink);outline:1px solid var(--ink);outline-offset:3px;
    padding:12px 10px 10px;margin:10px 4px 4px}
  .mini-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
  .mini-head b{font-family:var(--wood);font-size:15px;letter-spacing:2px;text-transform:uppercase;font-weight:400}
  .mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .mini-dow{color:var(--tan);font-size:9px;font-weight:800;padding-bottom:5px;font-family:var(--small)}
  .mini-d{color:var(--ink);font-size:11.5px;padding:6px 0;position:relative;cursor:pointer;font-weight:600}
  .mini-d.dim{color:var(--pale)}
  .mini-d.ev::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:var(--red)}
  .mini-d.done::after{background:var(--tan)}
  .mini-d.today{background:var(--ink);color:var(--paper);font-weight:900}
  .mini-d.today::after{background:var(--paper)}

  /* day sheet */
  .day-ev{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px dotted var(--tan);cursor:pointer}
  .day-ev:last-child{border-bottom:0}
  .day-ev .dn{font-family:var(--wood);font-size:17px;letter-spacing:.5px;text-transform:uppercase}
  .day-ev .dm{font-size:11px;color:var(--faded);font-style:italic;margin-top:1px}
  .day-ev .dt{font-family:var(--small);font-size:10px;font-weight:800;color:var(--red);letter-spacing:1px;white-space:nowrap}
  .day-ev.done .dn{color:var(--faded);text-decoration:line-through}

  /* custom workout builder */
  .bx{border:1.5px solid var(--ink);background:var(--paper2);padding:9px 11px;margin-top:10px;display:flex}
  .bx-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .bx-name{font-family:var(--wood);font-size:17px;letter-spacing:.5px;text-transform:uppercase}
  .bx-mus{font-size:8.5px;font-weight:800;letter-spacing:1.5px;color:var(--red);font-family:var(--small);text-transform:uppercase;margin-top:2px}
  .bx-x{color:var(--red);font-size:15px;padding:2px 6px}
  .bx-ctl{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
  .bx-f{display:flex;align-items:center;gap:6px}
  .bx-f label{font-size:8.5px;font-weight:800;letter-spacing:1px;color:var(--faded);font-family:var(--small);text-transform:uppercase}
  .bx-f input{width:56px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);font-size:13px;padding:6px 4px;text-align:center;outline:none;border-radius:0}

  /* exercise picker */
  .pick-list{max-height:44dvh;overflow-y:auto;border:1.5px solid var(--ink);background:var(--paper2);margin-top:10px}
  .pick-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px dotted var(--tan);cursor:pointer}
  .pick-item:last-child{border-bottom:0}
  .pick-item:active{background:#e5d7b8}
  .pick-item .pn{font-size:13.5px;font-weight:700}
  .pick-item .pe{font-size:10px;color:var(--faded);font-style:italic;margin-top:1px}
  .pick-item .pm{font-size:8.5px;font-weight:800;letter-spacing:1.5px;color:var(--red);font-family:var(--small);text-transform:uppercase}

  /* tab bar */
  .tabs{flex:none;display:flex;justify-content:space-around;align-items:center;background:var(--ink);
    padding:8px 4px calc(10px + var(--sab))}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tan);font-size:9.5px;font-weight:700;
    letter-spacing:1.5px;padding:4px 12px;text-transform:uppercase;font-family:var(--small)}
  .tab .ic{font-size:19px;line-height:1;filter:grayscale(1) opacity(.5)}
  .tab.on{color:var(--paper)}
  .tab.on .ic{filter:grayscale(1) brightness(3)}

  /* inputs */
  .field{margin-top:12px}
  .field label{display:block;font-size:10px;font-weight:800;letter-spacing:2px;color:var(--faded);text-transform:uppercase;
    margin-bottom:6px;font-family:var(--small)}
  .inp{width:100%;background:var(--paper2);border:1.5px solid var(--ink);color:var(--ink);
    font-size:14px;padding:11px 12px;outline:none;border-radius:0}
  .inp:focus{border-color:var(--red);box-shadow:2px 2px 0 var(--ink)}
  input[type=date].inp,input[type=time].inp{color-scheme:light}

  /* number field with steppers (replaces bare numeric inputs) */
  .stp{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);background:var(--paper)}
  .stp input{width:46px;border:0;background:none;color:var(--ink);font-size:13.5px;padding:6px 2px;
    text-align:center;outline:none;border-radius:0;font-family:var(--serif);-moz-appearance:textfield}
  .stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stp.wide input{width:64px}
  .stp-b{width:30px;flex:none;background:var(--paper2);color:var(--ink);font-size:15px;line-height:1;
    border:0;border-right:1.5px solid var(--ink);font-family:var(--serif)}
  .stp-b:last-child{border-right:0;border-left:1.5px solid var(--ink)}
  .stp-b:active{background:var(--ink);color:var(--paper)}

  /* date picker sheet (reuses the mini-calendar grid) */
  .mini-d.sel{background:var(--red);color:var(--paper);font-weight:700}
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin:12px 0 2px}
  .dp-head b{font-family:var(--wood);font-size:19px;letter-spacing:1px;text-transform:uppercase;font-weight:400}

  /* rest timer bar */
  body.rest-on .scrolly{padding-bottom:calc(86px + var(--sab))}
  .rest-bar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;align-items:center;gap:12px;
    background:var(--ink);color:var(--paper);padding:10px 14px calc(10px + var(--sab));
    animation:slideup .2s ease;overflow:hidden}
  .rest-bar .rest-lbl{font-family:var(--small);font-size:8px;letter-spacing:2px;font-weight:700;
    text-transform:uppercase;color:var(--pale)}
  .rest-bar .rest-t{font-family:var(--wood);font-size:27px;letter-spacing:1.5px;line-height:1;margin-top:2px}
  .rest-bar button{border:1.5px solid var(--pale);color:var(--paper);background:none;font-family:var(--small);
    font-size:9px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;padding:8px 10px}
  .rest-bar button:active{background:var(--paper);color:var(--ink)}
  .rest-prog{position:absolute;left:0;bottom:0;height:3px;background:var(--red);transition:width 1s linear}

  /* themed dropdown (replaces native <select>) */
  .ssel{position:relative}
  .ssel-btn,.date-btn{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--paper2);
    border:1.5px solid var(--ink);color:var(--ink);font-size:14px;padding:11px 12px;text-align:left;gap:8px}
  .ssel-btn:active,.date-btn:active{box-shadow:2px 2px 0 var(--ink)}
  .ssel-arr{color:var(--red);font-size:12px;flex:none}
  .ssel-list{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--paper2);
    border:1.5px solid var(--ink);box-shadow:3px 3px 0 rgba(43,32,22,.4);max-height:38dvh;overflow-y:auto;z-index:60}
  .ssel-item{padding:11px 12px;font-size:13.5px;border-bottom:1px dotted var(--tan);cursor:pointer}
  .ssel-item:last-child{border-bottom:0}
  .ssel-item.on{background:var(--ink);color:var(--paper);font-weight:700}
  .ssel-item:active{background:#e5d7b8}

  /* sheet / modal */
  .sheet-back{position:fixed;inset:0;background:rgba(43,32,22,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--paper);border:2px solid var(--ink);border-bottom:0;width:100%;max-width:560px;
    max-height:88dvh;overflow-y:auto;padding:18px 18px calc(22px + var(--sab));animation:slideup .22s ease;
    background-image:radial-gradient(rgba(43,32,22,.05) 1px,transparent 1px);background-size:4px 4px}
  .sheet h3{font-family:var(--wood);font-size:24px;letter-spacing:1.5px;text-transform:uppercase;font-weight:400}
  .sheet .close{position:sticky;float:right;top:0;color:var(--faded);font-size:20px;padding:2px 8px}
  .btnrow{display:flex;gap:10px;margin-top:16px}
  .btnrow .cta{margin-top:0}
  .danger{color:var(--red)}
  .cta.ghost.danger{color:var(--red)}
  @keyframes slideup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .anim-fade{animation:fadein .18s ease}

  /* one-exercise-at-a-time session */
  .prog{height:5px;background:var(--pale);border:1.5px solid var(--ink);position:relative;margin-top:4px}
  .prog i{position:absolute;left:0;top:0;bottom:0;background:var(--red);transition:width .2s}
  .prog-lbl{display:flex;justify-content:space-between;font-family:var(--small);font-size:8px;
    letter-spacing:1.4px;font-weight:700;color:var(--tan);text-transform:uppercase;margin-top:4px}
  .exname{font-family:var(--wood);font-size:29px;letter-spacing:.5px;text-transform:uppercase;
    line-height:1;margin:12px 0 2px;cursor:pointer}
  .extag{font-family:var(--small);font-size:8.5px;letter-spacing:1.5px;font-weight:700;
    color:var(--red);text-transform:uppercase}
  .lastline{font-family:var(--serif);font-style:italic;font-size:11.5px;color:var(--faded);margin-top:6px}
  .lastcell{font-family:var(--serif);font-style:italic;font-size:9.5px;color:var(--tan);
    white-space:nowrap;min-width:52px;flex:none}
  /* the "last time" column costs width, so the session's steppers run narrower */
  .setrow .stp input{width:38px}
  .setrow .stp-b{width:26px}
  .setrow{gap:6px}
  .lastcell b{font-style:normal;color:var(--faded)}
  .prtag{background:var(--red);color:#fff;font-family:var(--small);font-size:7px;letter-spacing:1.2px;
    font-weight:700;padding:1px 4px;text-transform:uppercase;margin-left:4px;vertical-align:1px}
  .sess-nav{display:flex;gap:8px;margin-top:14px}
  .sess-nav button{flex:1;border:1.5px solid var(--ink);background:none;padding:12px 0;
    font-family:var(--small);font-size:10px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase}
  .sess-nav button:disabled{opacity:.35}
  .sess-nav button.main{background:var(--ink);color:var(--paper)}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
  .dots .dot{width:9px;height:9px;border:1.5px solid var(--ink);background:none;padding:0}
  .dots .dot.on{background:var(--red);border-color:var(--red)}
  .dots .dot.done{background:var(--ink)}

  /* history */
  .stat-row{display:flex;border:2px solid var(--ink);background:var(--paper2);margin-top:4px}
  .stat{flex:1;padding:10px 8px;text-align:center;border-right:1px dotted var(--tan)}
  .stat:last-child{border-right:0}
  .stat .v{font-family:var(--wood);font-size:24px;line-height:1}
  .stat .k{font-family:var(--small);font-size:7.5px;letter-spacing:1.3px;font-weight:700;
    color:var(--tan);text-transform:uppercase;margin-top:3px}
  .log-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .log-h .ln{font-family:var(--wood);font-size:19px;letter-spacing:.6px;text-transform:uppercase}
  .log-h .ld{font-family:var(--small);font-size:8px;letter-spacing:1.3px;font-weight:700;
    color:var(--red);text-transform:uppercase;white-space:nowrap}
  .log-e{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 0;
    border-top:1px dotted var(--tan)}
  .log-e .lw{font-weight:700;white-space:nowrap}

  /* multi-select picker */
  .pbox{width:18px;height:18px;flex:none;border:1.5px solid var(--ink);display:flex;align-items:center;
    justify-content:center;font-size:12px;color:transparent;background:var(--paper)}
  .pick-item.sel .pbox{background:var(--red);color:#fff}

  /* builder reorder grip */
  .bx-grip{display:flex;flex-direction:column;gap:3px;flex:none;justify-content:center;margin-right:8px}
  .bx-grip button{width:26px;height:21px;border:1.5px solid var(--ink);background:var(--paper);
    font-size:10px;line-height:1;color:var(--ink)}
  .bx-grip button:disabled{opacity:.3}

  /* session logger */
  .setrow{display:flex;align-items:center;gap:8px;padding:6px 0}
  .setrow .snum{width:22px;font-size:10px;font-weight:800;color:var(--tan);font-family:var(--small)}
  .setrow input{width:64px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);
    font-size:13px;padding:7px 8px;text-align:center;outline:none;border-radius:0}
  .setrow .unit{font-size:10px;color:var(--tan);margin-left:-4px;font-style:italic}
  .tick{width:30px;height:30px;border:1.5px solid var(--ink);display:flex;align-items:center;
    justify-content:center;font-size:15px;color:transparent;margin-left:auto;flex:none;background:var(--paper2)}
  .tick.on{background:var(--red);border-color:var(--ink);color:var(--paper)}
  .exhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
  .exhead b{font-family:var(--wood);font-size:18px;letter-spacing:1px;text-transform:uppercase;font-weight:400}
  .exhead span{font-size:11px;color:var(--faded);font-style:italic}
  .doneburst{text-align:center;padding:36px 14px}
  .doneburst .big{font-size:52px}
  .doneburst h2{font-family:var(--wood);font-size:40px;letter-spacing:1px;text-transform:uppercase;margin-top:8px;
    color:var(--red);font-weight:400;line-height:.95}
  .doneburst p{color:var(--faded);font-size:13.5px;margin-top:10px;line-height:1.6;font-style:italic}

  /* library */
  .plan-card{background:var(--paper2);border:1.5px solid var(--ink);padding:14px;margin:12px 4px 0;cursor:pointer;
    box-shadow:3px 3px 0 rgba(43,32,22,.25)}
  .plan-card h4{font-family:var(--wood);font-size:21px;letter-spacing:1px;text-transform:uppercase;font-weight:400}
  .plan-card .pd{color:var(--faded);font-size:12px;margin-top:4px;line-height:1.55;font-style:italic}
  .plan-card .tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .tag{font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);
    border:1px solid var(--red);padding:2px 8px;font-family:var(--small)}
  .ex-head{font-family:var(--wood);font-size:15px;letter-spacing:1px;text-transform:uppercase;
    color:var(--red);border-bottom:1.5px solid var(--ink);padding:12px 0 4px;margin-top:8px}
  .ex-head:first-child{margin-top:0;padding-top:2px}
  .ex-item{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px dotted var(--tan)}
  .ex-item:last-child{border-bottom:0}
  .ex-item .en{font-size:13.5px;font-weight:700}
  .ex-item .eq{font-size:10.5px;color:var(--faded);margin-top:2px;font-style:italic}

<script>
'use strict';
/* ── Brologue — workout & fitness tracking PWA ─────────────────────── */

/* DOM helper (Dokit pattern) */
function h(tag, attrs, ...children){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(k === 'className') el.className = v;
    else if(k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if(k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    /* booleans are presence-based: setAttribute('disabled', false) would still disable */
    else if(typeof v === 'boolean'){ if(v) el.setAttribute(k, ''); }
    else if(v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for(const c of children.flat()) if(c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}

/* themed dropdown — native <select> opens the OS picker on phones */
function styledSelect(options, value, onChange){
  let cur = value !== undefined ? value : (options[0] && options[0][0]);
  const label = v => { const o = options.find(x=>x[0]===v); return o ? o[1] : ''; };
  const btnTxt = h('span',{}, label(cur));
  const list = h('div',{className:'ssel-list'});
  const root = h('div',{className:'ssel'});
  const onDoc = e => { if(!root.contains(e.target)) close(); };
  const close = ()=>{ list.style.display='none'; document.removeEventListener('click', onDoc, true); };
  const open = ()=>{
    list.innerHTML='';
    for(const [v,l] of options){
      list.append(h('div',{className:'ssel-item'+(v===cur?' on':''), onClick:e=>{
        e.stopPropagation();
        cur = v; btnTxt.textContent = label(v); close();
        if(onChange) onChange(v);
      }}, l));
    }
    list.style.display='block';
    document.addEventListener('click', onDoc, true);
  };
  root.append(
    h('button',{className:'ssel-btn', type:'button', onClick:e=>{
      e.preventDefault();
      list.style.display==='block' ? close() : open();
    }}, btnTxt, h('span',{className:'ssel-arr'},'▾')),
    list);
  Object.defineProperty(root, 'value', {
    get: ()=>cur,
    set: v=>{ cur = v; btnTxt.textContent = label(v); },
  });
  return root;
}

/* number field with -/+ steppers; returns the wrapper, .input is the field */
function numField(o){
  o = o || {};
  const inp = h('input', Object.assign({type:'number', inputmode:'numeric'}, o.attrs||{}));
  if(o.min !== undefined) inp.setAttribute('min', String(o.min));
  if(o.max !== undefined) inp.setAttribute('max', String(o.max));
  inp.setAttribute('step', String(o.step || 1));
  const st = o.step || 1;
  const clamp = v => {
    if(isNaN(v)) v = (o.min !== undefined ? o.min : 0);
    if(o.min !== undefined) v = Math.max(o.min, v);
    if(o.max !== undefined) v = Math.min(o.max, v);
    return Math.round(v * 100) / 100;
  };
  const bump = d => {
    const base = parseFloat(inp.value);
    inp.value = String(clamp((isNaN(base) ? (o.min !== undefined ? o.min : 0) : base) + d * st));
    inp.dispatchEvent(new Event('input', {bubbles:true}));
  };
  const el = h('div',{className:'stp'+(o.wide?' wide':'')},
    h('button',{className:'stp-b', type:'button', onClick:e=>{e.preventDefault(); bump(-1);}},'−'),
    inp,
    h('button',{className:'stp-b', type:'button', onClick:e=>{e.preventDefault(); bump(1);}},'+'));
  el.input = inp;
  return el;
}

/* newsprint date picker — same grid as the Today mini calendar */
function datePicker(value, onPick){
  let view = fromDs(value || today());
  view = new Date(view.getFullYear(), view.getMonth(), 1);
  const label = h('b',{});
  const grid = h('div',{className:'mini-grid'});
  const draw = ()=>{
    const yr = view.getFullYear(), mo = view.getMonth();
    label.textContent = view.toLocaleDateString('en-US',{month:'long', year:'numeric'});
    grid.innerHTML = '';
    DOW.forEach(dw=>grid.append(h('div',{className:'mini-dow'}, dw[0])));
    const first = new Date(yr,mo,1); let sdow = first.getDay(); sdow = sdow===0?6:sdow-1;
    const dim = new Date(yr,mo+1,0).getDate(), prevDim = new Date(yr,mo,0).getDate();
    const cells = [];
    for(let i=sdow-1;i>=0;i--) cells.push({date:new Date(yr,mo-1,prevDim-i), other:true});
    for(let i=1;i<=dim;i++) cells.push({date:new Date(yr,mo,i), other:false});
    while(cells.length%7) cells.push({date:new Date(yr,mo+1,cells.length-sdow-dim+1), other:true});
    for(const {date,other} of cells){
      const dstr = ds(date);
      const cls = 'mini-d'+(other?' dim':'')+(dstr===today()?' today':'')+(dstr===value?' sel':'');
      grid.append(h('div',{className:cls, onClick:()=>{ back.remove(); onPick(dstr); }}, date.getDate()));
    }
  };
  const step = n => { view = new Date(view.getFullYear(), view.getMonth()+n, 1); draw(); };
  const back = sheet(
    h('h3',{},'Pick a date'),
    h('div',{className:'dp-head'},
      h('button',{className:'icon-btn', onClick:()=>step(-1)},'‹'), label,
      h('button',{className:'icon-btn', onClick:()=>step(1)},'›')),
    grid,
    h('button',{className:'cta ghost', onClick:()=>{ back.remove(); onPick(today()); }},'TODAY'));
  draw();
  return back;
}

/* newsprint confirm — replaces window.confirm */
function confirmSheet(title, msg, okLabel, onOk){
  const back = sheet(
    h('div',{className:'kick'},'Hold up'),
    h('h3',{style:{marginTop:'4px'}}, title),
    msg ? h('div',{className:'empty', style:{textAlign:'left', padding:'12px 0 0'}}, msg) : null,
    h('div',{className:'btnrow'},
      h('button',{className:'cta ghost', style:{flex:'1'}, onClick:()=>back.remove()},'CANCEL'),
      h('button',{className:'cta', style:{flex:'1'}, onClick:()=>{ back.remove(); onOk(); }}, okLabel)));
  return back;
}

/* rest timer — lives on <body> so a re-render can't kill it */
let REST = null;
function stopRest(){
  if(REST){ clearInterval(REST.iv); REST.el.remove(); REST = null; }
  document.body.classList.remove('rest-on');
}
function restChime(){
  try{ if(navigator.vibrate) navigator.vibrate([120,70,120]); }catch(e){}
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ac = new AC(), o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = 784;
    o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.55);
    o.start(); o.stop(ac.currentTime + 0.55);
    setTimeout(()=>{ try{ ac.close(); }catch(e){} }, 900);
  }catch(e){}
}
function startRest(secs){
  stopRest();
  secs = parseInt(secs) || 0;
  if(secs <= 0) return;
  let left = secs, total = secs;
  const t = h('div',{className:'rest-t'});
  const prog = h('div',{className:'rest-prog'});
  const paint = ()=>{
    const m = Math.floor(left/60), sec = left%60;
    t.textContent = m ? m+':'+String(sec).padStart(2,'0') : sec+'s';
    prog.style.width = Math.max(0, Math.min(100, (left/total)*100)) + '%';
  };
  const el = h('div',{className:'rest-bar'}, prog,
    h('div',{}, h('div',{className:'rest-lbl'},'Rest'), t),
    h('div',{style:{marginLeft:'auto', display:'flex', gap:'8px'}},
      h('button',{onClick:()=>{ left += 30; total = Math.max(total, left); paint(); }},'+30s'),
      h('button',{onClick:stopRest},'Skip')));
  paint();
  document.body.append(el);
  document.body.classList.add('rest-on');
  REST = { el, iv: setInterval(()=>{
    left--;
    if(left <= 0){ stopRest(); restChime(); toast('Rest done — next set 💪'); return; }
    paint();
  }, 1000) };
}

/* ── date helpers ──────────────────────────────────────────────────── */
function ds(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function fromDs(s){ const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); }
function today(){ return ds(new Date()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function wkStart(d){ const wd=new Date(d); const day=wd.getDay(); const diff=day===0?-6:1-day; wd.setDate(wd.getDate()+diff); wd.setHours(0,0,0,0); return wd; }
function dayDiff(a,b){ return Math.round((fromDs(b) - fromDs(a)) / 86400000); }
function fmtTime(t){ if(!t) return ''; const [hh,mm]=t.split(':').map(Number); const am=hh<12; const h12=hh%12===0?12:hh%12; return `${h12}:${String(mm).padStart(2,'0')}${am?'am':'pm'}`; }
function minutesOf(t){ if(!t) return 0; const [hh,mm]=t.split(':').map(Number); return hh*60+mm; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* workout lookup across presets + custom */
function getWorkout(id){
  if(WORKOUTS[id]) return {id, ...WORKOUTS[id]};
  const c = db.custom.find(w=>w.id===id);
  return c ? {id:c.id, name:c.name, focus:c.focus||'Custom workout', mins:c.mins||40, ex:c.ex} : null;
}
function allWorkoutOptions(keepId){
  const have = myGear();
  const keep = w => canDoWorkout(w, have);
  const opts = [];
  /* your own workouts first, then the presets */
  for(const c of db.custom) if(keep(c) || c.id===keepId) opts.push([c.id, c.name+' (custom)']);
  for(const [id,w] of Object.entries(WORKOUTS)) if(keep(w) || id===keepId) opts.push([id, w.name]);
  if(!opts.length) for(const [id,w] of Object.entries(WORKOUTS)) opts.push([id, w.name]);
  return opts;
}

/* ── recurrence engine ─────────────────────────────────────────────── */
/* entry: {id, workoutId, date, time, recur:{freq,interval,days[]}, until, exceptions[]} */
function occursOn(entry, dateStr){
  if(dateStr < entry.date) return false;
  if(entry.exceptions && entry.exceptions.includes(dateStr)) return false;
  if(entry.until && dateStr > entry.until) return false;
  const r = entry.recur || {freq:'none'};
  const diff = dayDiff(entry.date, dateStr);
  if(r.freq === 'none')   return dateStr === entry.date;
  if(r.freq === 'daily')  return diff % (r.interval||1) === 0;
  if(r.freq === 'weekly'){
    const dow = fromDs(dateStr).getDay();
    const days = (r.days && r.days.length) ? r.days : [fromDs(entry.date).getDay()];
    if(!days.includes(dow)) return false;
    const weeks = Math.round((wkStart(fromDs(dateStr)) - wkStart(fromDs(entry.date))) / 604800000);
    return weeks % (r.interval||1) === 0;
  }
  if(r.freq === 'monthly'){
    const a = fromDs(entry.date), b = fromDs(dateStr);
    if(a.getDate() !== b.getDate()) return false;
    const months = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
    return months % (r.interval||1) === 0;
  }
  return false;
}
function eventsForDate(dateStr){
  return db.schedule.filter(e=>occursOn(e, dateStr)).map(e=>({
    entry:e, workout:getWorkout(e.workoutId), date:dateStr, time:e.time,
    done: db.logs.some(l=>l.date===dateStr && l.entryId===e.id),
  })).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
}
function recurLabel(e){
  const r = e.recur||{freq:'none'};
  if(r.freq==='none') return 'One-off';
  if(r.freq==='daily') return r.interval>1?`Every ${r.interval} days`:'Daily';
  if(r.freq==='weekly'){
    const days=(r.days&&r.days.length)?r.days.map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(' · '):'weekly';
    return (r.interval>1?`Every ${r.interval} weeks: `:'Weekly: ')+days;
  }
  if(r.freq==='monthly') return 'Monthly';
  return '';
}

/* ── training history ──────────────────────────────────────────────
   db.logs has always been written on finish; these read it back. */
function logsFor(name){
  const out = [];
  for(const l of db.logs){
    const e = (l.ex||[]).find(x=>x.name===name);
    if(e && e.sets && e.sets.length) out.push({date:l.date, at:l.finishedAt||0, sets:e.sets});
  }
  return out.sort((a,b)=>b.at-a.at);
}
function lastFor(name){ const hs = logsFor(name); return hs.length ? hs[0] : null; }
function bestFor(name){
  let best = 0;
  for(const hh of logsFor(name)) for(const st of hh.sets){
    const w = parseFloat(st.w); if(!isNaN(w) && w > best) best = w;
  }
  return best;
}
function topSet(sets){
  let best = null;
  for(const st of sets) if(!best || (parseFloat(st.w)||0) > (parseFloat(best.w)||0)) best = st;
  return best;
}
function setLabel(st){
  const w = parseFloat(st.w);
  return (isNaN(w) || !w ? 'bodyweight' : w+' kg') + ' × ' + (st.r || '—');
}
function sessionVolume(l){
  let v = 0;
  for(const e of (l.ex||[])) for(const st of e.sets){
    const w = parseFloat(st.w)||0, r = parseFloat(st.r)||0;
    v += w * r;
  }
  return v;
}

const CTA_LABELS = {
  chest:'PUMP THE PECS →', back:'BEND THE BAR →', legs:'QUADZILLA →',
  shoulders:'BUILD THE BOULDERS →', arms:'HIT THE IRON →', core:'BRACE UP →',
  cardio:'CHASE THE BURN →', full:'FULL SEND →', neck:'THICKEN THE NECK →',
};
function primaryMuscle(w){
  const tally = {};
  for(const t of (w && w.ex || [])){
    const ex = EXERCISES.find(e=>e.name===t[0]);
    if(ex) tally[ex.muscle] = (tally[ex.muscle]||0) + 1;
  }
  let best = null, n = 0;
  for(const k in tally) if(tally[k] > n){ n = tally[k]; best = k; }
  return best;
}
function ctaLabel(w, done){
  if(done) return 'GO AGAIN →';
  if(!w) return 'PICK TODAY’S IRON →';
  return CTA_LABELS[primaryMuscle(w)] || 'HIT THE IRON →';
}

function streakCount(){
  const dates = [...new Set(db.logs.map(l=>l.date))].sort().reverse();
  if(!dates.length) return 0;
  let cur = today();
  if(dates[0] !== cur){
    const y = ds(addDays(new Date(),-1));
    if(dates[0] !== y) return 0;
    cur = y;
  }
  let n = 0;
  for(const d of dates){
    if(d === cur){ n++; cur = ds(addDays(fromDs(cur),-1)); }
    else if(d < cur) break;
  }
  return n;
}

function MiniMonth(){
  const d = STATE.miniDate, yr = d.getFullYear(), mo = d.getMonth();
  const box = h('div',{className:'mini-cal'});
  box.append(h('div',{className:'mini-head'},
    h('button',{className:'icon-btn', onClick:()=>{STATE.miniDate=new Date(yr,mo-1,1); render();}},'‹'),
    h('b',{}, d.toLocaleDateString('en-US',{month:'long', year:'numeric'})),
    h('button',{className:'icon-btn', onClick:()=>{STATE.miniDate=new Date(yr,mo+1,1); render();}},'›')));
  const grid = h('div',{className:'mini-grid'});
  DOW.forEach(dw=>grid.append(h('div',{className:'mini-dow'}, dw[0])));
  const first = new Date(yr,mo,1); let sdow = first.getDay(); sdow = sdow===0?6:sdow-1;
  const dim = new Date(yr,mo+1,0).getDate(), prevDim = new Date(yr,mo,0).getDate();
  const cells = [];
  for(let i=sdow-1;i>=0;i--) cells.push({date:new Date(yr,mo-1,prevDim-i), other:true});
  for(let i=1;i<=dim;i++) cells.push({date:new Date(yr,mo,i), other:false});
  while(cells.length%7) cells.push({date:new Date(yr,mo+1,cells.length-sdow-dim+1), other:true});
  for(const {date,other} of cells){
    const s = ds(date);
    const evs = other?[]:eventsForDate(s);
    const cls = 'mini-d'+(other?' dim':'')+(s===today()?' today':'')+(evs.length?(evs.every(e=>e.done)?' ev done':' ev'):'');
    grid.append(h('div',{className:cls, onClick:()=>daySheet(s)}, date.getDate()));
  }
  box.append(grid);
  return box;
}

function chooseSheet(){

function startSession(ev){
  const w = ev.workout || getWorkout(ev.entry.workoutId);
  startWorkout(w, ev);
}
function startWorkout(w, ev){
  if(!w) return;
  STATE.session = {
    cur: 0,
    entryId: ev && ev.entry ? ev.entry.id : null,
    date: (ev && ev.date) || today(),
    workoutId: w.id, name: w.name,
    startedAt: Date.now(), finished: false,
    ex: w.ex.map(([name,sets,reps,wt,rest])=>({name, reps,
      rest: (rest === undefined || rest === null) ? DEFAULT_REST : rest,
      sets:Array.from({length:sets},()=>({done:false, weight: wt?String(wt):'', reps:''}))})),
  };
  render();
}
function SessionScreen(){
  const s = STATE.session;
  const wrap = h('div',{className:'screen anim-fade'});
  if(s.finished){
    const totalSets = s.ex.reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0);
    const mins = Math.max(1, Math.round((Date.now()-s.startedAt)/60000));
    wrap.append(h('div',{className:'scrolly'},
      h('div',{className:'doneburst'},
        h('div',{className:'big'},'🏆'),
        h('h2',{},'Front page news!'),
        h('p',{}, `${s.name} — ${totalSets} sets in ${mins} min.\n🔥 Streak: ${streakCount()} day${streakCount()===1?'':'s'}. Keep the fire burning.`),
        h('button',{className:'cta', onClick:()=>{STATE.session=null; STATE.tab='today'; render();}},'DONE'))));
    return wrap;
  }
  wrap.append(h('div',{className:'app-bar'},
    h('button',{className:'icon-btn', onClick:()=>confirmSheet(
      'Quit this workout?', 'Nothing you’ve logged in this session will be saved.', 'QUIT',
      ()=>{ stopRest(); STATE.session=null; render(); })},'✕'),
    h('div',{className:'title'}, s.name),
    h('span',{style:{width:'34px'}})));
  const body = h('div',{className:'scrolly'});
  if(s.cur === undefined) s.cur = 0;
  s.cur = Math.max(0, Math.min(s.ex.length-1, s.cur));
  const ex = s.ex[s.cur];
  const prev = lastFor(ex.name), best = bestFor(ex.name);

  /* progress across the whole workout */
  const totalSets = s.ex.reduce((n,e)=>n+e.sets.length,0);
  const doneSets  = s.ex.reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0);
  body.append(
    h('div',{className:'prog'}, h('i',{style:{width:(doneSets/totalSets*100)+'%'}})),
    h('div',{className:'prog-lbl'},
      h('span',{},`Exercise ${s.cur+1} of ${s.ex.length}`),
      h('span',{},`${doneSets} / ${totalSets} sets`)));

  const meta = EXERCISES.find(e=>e.name===ex.name);
  body.append(
    h('div',{className:'exname', onClick:()=>{ if(meta) exerciseSheet(meta); }}, ex.name),
    h('div',{className:'extag'}, (meta?meta.muscle+' · ':'') + `target ${ex.reps}` + (ex.rest?` · rest ${ex.rest}s`:'')));
  if(prev) body.append(h('div',{className:'lastline'},
    `Last time · ${prev.sets.map(setLabel).join(', ')}`));

  const card = h('div',{className:'card', style:{marginTop:'10px'}});
  const drawSets = ()=>{
    card.innerHTML = '';
    ex.sets.forEach((set,i)=>{
      const pv = prev && prev.sets[i];
      if(pv && !set.weight) set.weight = pv.w || '';
      const wFld = numField({min:0, step:2.5, attrs:{inputmode:'decimal', placeholder:pv?String(pv.w||'kg'):'kg', value:set.weight}});
      wFld.input.addEventListener('input',()=>set.weight=wFld.input.value);
      const rFld = numField({min:0, step:1, attrs:{placeholder:pv?String(pv.r||''):(ex.reps.replace(/\D/g,'')||'reps'), value:set.reps}});
      rFld.input.addEventListener('input',()=>set.reps=rFld.input.value);
      const isPr = best > 0 && (parseFloat(set.weight)||0) > best;
      const tick = h('button',{className:'tick'+(set.done?' on':''), onClick:()=>{
        set.done = !set.done;
        if(set.done) startRest(ex.rest); else stopRest();
        render();
      }},'✓');
      card.append(h('div',{className:'setrow'},
        h('span',{className:'snum'},'S'+(i+1)),
        h('span',{className:'lastcell'}, pv ? h('span',{}, 'last ', h('b',{}, `${pv.w||'bw'}×${pv.r||'—'}`)) : '—',
          (isPr && set.done) ? h('span',{className:'prtag'},'PR') : null),
        wFld, rFld, tick));
    });
    card.append(h('button',{className:'cta ghost', style:{marginTop:'8px', padding:'9px', fontSize:'10px'},
      onClick:()=>{ const l = ex.sets[ex.sets.length-1];
        ex.sets.push({done:false, weight:l?l.weight:'', reps:''}); render(); }},'＋ ADD SET'));
  };
  drawSets();
  body.append(card);

  /* move between exercises */
  const nav = h('div',{className:'sess-nav'},
    h('button',{disabled:s.cur===0, onClick:()=>{ s.cur--; render(); }},'‹ PREV'),
    h('button',{className:'main', onClick:()=>{
      if(s.cur < s.ex.length-1){ s.cur++; render(); }
      else finishSession(s);
    }}, s.cur < s.ex.length-1 ? 'NEXT ›' : 'FINISH 🏁'));
  body.append(nav);
  const dots = h('div',{className:'dots'});
  s.ex.forEach((e,i)=>dots.append(h('button',{
    className:'dot'+(i===s.cur?' on':(e.sets.every(x=>x.done)?' done':'')),
    onClick:()=>{ s.cur=i; render(); }})));
  body.append(dots);
  wrap.append(body);
  return wrap;
}
function finishSession(s){
  const save = ()=>{
    stopRest();
    const logs = db.logs;
    logs.push({id:uid(), date:s.date, entryId:s.entryId, workoutId:s.workoutId, name:s.name,
      finishedAt:Date.now(), mins:Math.round((Date.now()-s.startedAt)/60000),
      ex:s.ex.map(e=>({name:e.name, sets:e.sets.filter(x=>x.done).map(x=>({w:x.weight, r:x.reps}))}))});
    db.logs = logs;
    s.finished = true; render();
  };
  if(s.ex.some(e=>e.sets.some(x=>x.done))) save();
  else confirmSheet('Nothing ticked yet','You haven’t ticked a single set. Log this workout anyway?','FINISH ANYWAY', save);
}

function HistoryScreen(){

    h('button',{className:'icon-btn', title:'Settings', onClick:settingsSheet},'⚙︎')));
  const body = h('div',{className:'scrolly'});

    body.append(h('div',{className:'card'},
      h('div',{className:'empty'},'No workouts logged yet.\nFinish one and it shows up here.')));
    wrap.append(body); return wrap;
  }
  const now = new Date(), ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const thisMonth = logs.filter(l=>(l.date||'').startsWith(ym)).length;
  const volume = logs.reduce((n,l)=>n+sessionVolume(l),0);
  body.append(h('div',{className:'stat-row'},
    h('div',{className:'stat'}, h('div',{className:'v'},'🔥'+streakCount()), h('div',{className:'k'},'Day streak')),
    h('div',{className:'stat'}, h('div',{className:'v'},String(thisMonth)), h('div',{className:'k'},'This month')),
    h('div',{className:'stat'}, h('div',{className:'v'}, volume>=1000 ? (volume/1000).toFixed(1)+'t' : Math.round(volume)+'kg'),
      h('div',{className:'k'},'Volume lifted'))));

  body.append(h('div',{className:'sl'},'Recent sessions'));
  for(const l of logs.slice(0,40)){
    const card = h('div',{className:'card', style:{marginTop:'10px'}});
    const when = l.date ? fromDs(l.date).toLocaleDateString('en-US',{weekday:'short', day:'numeric', month:'short'}).toUpperCase() : '';
    card.append(h('div',{className:'log-h'},
      h('span',{className:'ln'}, l.name),
      h('span',{className:'ld'}, when)));
    const nSets = (l.ex||[]).reduce((n,e)=>n+e.sets.length,0);
    card.append(h('div',{className:'meta'}, `${(l.ex||[]).length} exercises · ${nSets} sets · ${l.mins||0} min`));
    for(const e of (l.ex||[])){
      const t = topSet(e.sets);
      if(!t) continue;
      /* was this the heaviest that lift has ever been, at the time? */
      const heavier = logsFor(e.name).some(hh => hh.at < (l.finishedAt||0)
        && hh.sets.some(x=>(parseFloat(x.w)||0) >= (parseFloat(t.w)||0)));
      const isPr = (parseFloat(t.w)||0) > 0 && !heavier;
      card.append(h('div',{className:'log-e'},
        h('span',{}, e.name, isPr ? h('span',{className:'prtag'},'PR') : null),
        h('span',{className:'lw'}, setLabel(t))));
    }
    body.append(card);
  }
  wrap.append(body);
  return wrap;
}

function planSheet(p){

      })),

          recur:{freq:'weekly', interval:1, days:[dow]}, until:null, exceptions:[]});
      }

      toast(p.name+' added to your calendar 🔥');

/* ── equipment matching ────────────────────────────────────────────
   An exercise is doable when it needs nothing, or you own one of the
   implements it lists. A *workout* is doable when every exercise is
   either doable outright or has a substitute chain you can do — the
   same 'try instead' data the Library shows. */
function myGear(){ return new Set(db.equipment); }
function canDoExercise(ex, have){
  if(!ex) return false;
  return ex.equip.length === 0 || ex.equip.some(q=>have.has(q));
}
function canDoNamed(name, have, depth){
  const ex = EXERCISES.find(e=>e.name===name);
  if(!ex) return true;                       // unknown name: never block on it
  if(canDoExercise(ex, have)) return true;
  return !!ex.sub && (depth||0) < 5 && canDoNamed(ex.sub, have, (depth||0)+1);
}
function canDoWorkout(w, have){
  if(!w || !w.ex || !w.ex.length) return true;
  have = have || myGear();
  return w.ex.every(t=>canDoNamed(t[0], have, 0));
}
function canDoPlan(pl, have){
  have = have || myGear();
  return pl.sched.every(([,wid])=>canDoWorkout(lookupWorkout(wid), have));
}
function lookupWorkout(id){ return WORKOUTS[id] || db.custom.find(c=>c.id===id) || null; }

function isWeighted(exName){
  const ex = EXERCISES.find(e=>e.name===exName);
  return !!(ex && ex.equip.some(q=>['barbell','ez bar','trap bar','dumbbell','kettlebell','plate',
    'machine','smith machine','cables','landmine','medicine ball','sled'].includes(q)));
}
function isTimed(exName){
  const ex = EXERCISES.find(e=>e.name===exName);
  return !!(ex && ex.timed);
}
function exercisePicker(onPick){
  let muscle='all', q='';
  const chosen = new Set();
  const have = myGear();
  const pool = EXERCISES.filter(ex=>canDoExercise(ex, have));
  const search = h('input',{className:'inp', placeholder:'Search exercises…'});
  const chips = h('div',{className:'chiprow'});
  const list = h('div',{className:'pick-list'});
  const refresh = ()=>{
    list.innerHTML='';
    const ql = q.trim().toLowerCase();
    let shown = 0;
    for(const ex of pool){
      if(muscle!=='all' && ex.muscle!==muscle) continue;
      if(ql && !ex.name.toLowerCase().includes(ql)) continue;
      const row = h('div',{className:'pick-item'+(chosen.has(ex.name)?' sel':''), onClick:()=>{
        chosen.has(ex.name) ? chosen.delete(ex.name) : chosen.add(ex.name);
        row.classList.toggle('sel');
        syncBtn();
      }},
        h('span',{className:'pbox'},'✓'),
        h('div',{style:{flex:'1'}},
          h('div',{className:'pn'}, ex.name),
          h('div',{className:'pe'}, (ex.equip.length?ex.equip.join(' / '):'bodyweight') + (ex.timed?' · timed':''))),
        h('span',{className:'pm'}, ex.muscle));
      list.append(row);
      shown++;
    }
    if(!shown) list.append(h('div',{className:'empty'},'Nothing here you can do with your equipment.'));
  };
  MUSCLES.forEach(m=>{
    const c = h('button',{className:'chip'+(m===muscle?' on':''), onClick:()=>{
      muscle = m;
      chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); refresh();
    }}, m[0].toUpperCase()+m.slice(1));
    chips.append(c);
  });
  search.addEventListener('input',()=>{ q = search.value; refresh(); });
  const addBtn = h('button',{className:'cta', onClick:()=>{
    if(!chosen.size) return;
    const picks = EXERCISES.filter(e=>chosen.has(e.name));
    back.remove();
    onPick(picks);
  }},'＋ ADD');
  const syncBtn = ()=>{
    addBtn.textContent = chosen.size
      ? `＋ ADD ${chosen.size} EXERCISE${chosen.size===1?'':'S'}`
      : 'PICK SOME EXERCISES';
    addBtn.style.opacity = chosen.size ? '1' : '.45';
  };
  const back = sheet(h('h3',{},'Pick exercises'),
    h('div',{className:'meta', style:{margin:'6px 0 10px'}},
      pool.length+' of '+EXERCISES.length+' moves fit your equipment · tap to select'),
    h('div',{className:'field'}, search), chips, list, addBtn);
  refresh(); syncBtn();
}
function customSheet(existing){
  const rows = existing ? existing.ex.map(e=>({
    name:e[0], sets:e[1],
    reps:String(e[2]).replace(/s$/,''),
    timed:/s$/.test(String(e[2])) || isTimed(e[0]),
    weight:e[3]||'',
    rest:(e[4] === undefined || e[4] === null) ? DEFAULT_REST : e[4],
  })) : [];
  const nameInp = h('input',{className:'inp', placeholder:'e.g. Saturday Smash', value: existing?existing.name:''});
  const listEl = h('div',{});
  const redraw = ()=>{
    listEl.innerHTML='';
    if(!rows.length) listEl.append(h('div',{className:'empty'},'No exercises yet.\nAdd some iron below.'));
    rows.forEach((r,i)=>{
      const setsFld = numField({min:1, max:12, attrs:{value:String(r.sets)}});
      setsFld.input.addEventListener('input',()=>r.sets=setsFld.input.value);
      const repsFld = numField({min:1, step:r.timed?5:1, attrs:{value:String(r.reps)}});
      repsFld.input.addEventListener('input',()=>r.reps=repsFld.input.value);
      const ctl = h('div',{className:'bx-ctl'},
        h('div',{className:'bx-f'}, h('label',{},'Sets'), setsFld),
        h('div',{className:'bx-f'}, h('label',{}, r.timed?'Seconds':'Reps'), repsFld));
      if(isWeighted(r.name)){
        const wFld = numField({min:0, step:2.5, attrs:{inputmode:'decimal', placeholder:'—', value:r.weight?String(r.weight):''}});
        wFld.input.addEventListener('input',()=>r.weight=wFld.input.value);
        ctl.append(h('div',{className:'bx-f'}, h('label',{},'Kg'), wFld));
      }
      const restFld = numField({min:0, max:600, step:15, attrs:{value:String(r.rest)}});
      restFld.input.addEventListener('input',()=>r.rest=restFld.input.value);
      ctl.append(h('div',{className:'bx-f'}, h('label',{},'Rest s'), restFld));
      const meta = EXERCISES.find(e=>e.name===r.name);
      const move = d => { const j=i+d; if(j<0||j>=rows.length) return;
        const t=rows[i]; rows[i]=rows[j]; rows[j]=t; redraw(); };
      listEl.append(h('div',{className:'bx'},
        h('div',{className:'bx-grip'},
          h('button',{disabled:i===0, onClick:()=>move(-1)},'▲'),
          h('button',{disabled:i===rows.length-1, onClick:()=>move(1)},'▼')),
        h('div',{style:{flex:'1', minWidth:'0'}},
          h('div',{className:'bx-head'},
            h('div',{},
              h('div',{className:'bx-name'}, r.name),
              h('div',{className:'bx-mus'}, (meta?meta.muscle:'custom') + (r.timed?' · timed':''))),
            h('button',{className:'bx-x', onClick:()=>{rows.splice(i,1); redraw();}},'✕')),
          ctl)));
    });
  };
  redraw();
  const back = sheet(
    h('h3',{}, existing ? 'Edit workout' : 'Custom workout'),
    existing ? null : h('div',{className:'btnrow', style:{marginTop:'12px'}},
      h('button',{className:'cta ghost', style:{flex:'1', marginTop:0, padding:'10px', fontSize:'10px'},
        onClick:()=>presetPicker(w=>{
          nameInp.value = nameInp.value || (w.name+' (mine)');
          for(const t of w.ex){
            const m = EXERCISES.find(e=>e.name===t[0]);
            rows.push({name:t[0], sets:t[1], reps:String(t[2]).replace(/s$/,''),
              timed:/s$/.test(String(t[2])) || (m && m.timed), weight:t[3]||'',
              rest:(t[4]==null)?DEFAULT_REST:t[4]});
          }
          redraw();
        })},'↧ FROM A PRESET')),
    h('div',{className:'field'}, h('label',{},'Name'), nameInp),
    h('div',{className:'field'}, h('label',{},'Exercises'), listEl),
    h('button',{className:'cta ghost', onClick:()=>exercisePicker(picks=>{
      for(const ex of picks) rows.push({name:ex.name, sets:3, reps: ex.timed?30:10,
        timed:!!ex.timed, weight:'', rest:DEFAULT_REST});
      redraw();
    })},'＋ ADD EXERCISES'),
    h('button',{className:'cta', onClick:()=>{
      const name = nameInp.value.trim();
      if(!name) return toast('Give it a name');
      if(!rows.length) return toast('Add at least one exercise');
      const ex = rows.map(r=>{
        const sets = Math.max(1, parseInt(r.sets)||3);
        const reps = String(Math.max(1, parseInt(r.reps)||(r.timed?30:10))) + (r.timed?'s':'');
        const w = parseFloat(r.weight);
        const rest = Math.min(600, Math.max(0, parseInt(r.rest)));
        return [r.name, sets, reps, (!isNaN(w) && w>0) ? w : null, isNaN(rest) ? DEFAULT_REST : rest];
      });
      const list = db.custom.filter(c=>!existing || c.id!==existing.id);
      list.push({id: existing?existing.id:'c_'+uid(), name, focus:'Custom workout', mins: existing&&existing.mins?existing.mins:40, ex});
      db.custom = list;
      back.remove(); render(); toast(existing?'Workout updated':'Custom workout saved');
    }},'SAVE WORKOUT'));
}
/* tap any library row */
function exerciseSheet(ex){
  const hs = logsFor(ex.name), best = bestFor(ex.name), last = hs[0];
  const have = myGear(), ok = canDoExercise(ex, have);
  const back = sheet(
    h('div',{className:'kick'}, ex.muscle + ' · ' + (ex.equip.length ? ex.equip.join(' / ') : 'bodyweight')),
    h('h3',{style:{marginTop:'4px'}}, ex.name),
    h('div',{className:'specs'},
      h('div',{className:'spec'}, h('div',{className:'k'},'Equipment'),
        h('div',{className:'v'}, ex.equip.length ? ex.equip.join(' / ') : 'bodyweight')),
      h('div',{className:'spec'}, h('div',{className:'k'},'Target'), h('div',{className:'v'}, ex.muscle)),
      h('div',{className:'spec'}, h('div',{className:'k'},'Logged as'), h('div',{className:'v'}, ex.timed ? 'Timed' : 'Reps'))),
    (!ok && ex.sub) ? h('div',{className:'swapbox'},
      h('div',{className:'k'},'You don’t have this equipment'),
      h('div',{className:'v'},'↳ Try instead: '+ex.sub)) : null,
    h('div',{className:'sec'},'Your history'),
    hs.length
      ? h('div',{},
          h('div',{className:'log-e'}, h('span',{},'Best set'), h('span',{className:'lw'}, best ? best+' kg' : '—')),
          h('div',{className:'log-e'}, h('span',{},'Last done'),
            h('span',{className:'lw'}, fromDs(last.date).toLocaleDateString('en-US',{day:'numeric', month:'short'}))),
          h('div',{className:'log-e'}, h('span',{},'Last session'), h('span',{className:'lw'}, last.sets.map(setLabel).join(', '))),
          h('div',{className:'log-e'}, h('span',{},'Sessions logged'), h('span',{className:'lw'}, String(hs.length))))
      : h('div',{className:'empty', style:{textAlign:'left', padding:'6px 0'}},'You haven’t logged this one yet.'),
    h('button',{className:'cta ghost', onClick:()=>{
      back.remove();
      COACH_PREFILL = `How do I do a ${ex.name} with good form?`;
      STATE.tab = 'coach';
      render();
    }},'ASK THE COACH ABOUT THIS'));
  return back;
}
let COACH_PREFILL = '';

/* copy a preset or one of your own as a starting point */
function presetPicker(onPick){
  const have = myGear();
  const row = w => h('div',{className:'ex-item', onClick:()=>{ back.remove(); onPick(w); }},
    h('div',{}, h('div',{className:'en'}, w.name),
      h('div',{className:'eq'}, `${w.ex.length} exercises · ${w.mins} min`)),
    h('span',{className:'mus'}, primaryMuscle(w) || 'mixed'));
  const mine = db.custom.filter(c=>canDoWorkout(c, have));
  const back = sheet(
    h('h3',{},'Start from…'),
    h('div',{className:'meta', style:{marginTop:'6px'}},'Copies its exercises in. Edit freely — the original is untouched.'),
    mine.length ? h('div',{className:'sl'},'Your workouts') : null,
    mine.length ? h('div',{className:'card'}, mine.map(row)) : null,
    h('div',{className:'sl'},'Presets'),
    h('div',{className:'card'}, Object.values(WORKOUTS).filter(w=>canDoWorkout(w, have)).map(row)));

function duplicateCustom(c){
  const copy = JSON.parse(JSON.stringify(c));
  copy.id = 'c_'+uid();
  copy.name = c.name + ' copy';
  db.custom = db.custom.concat([copy]);
  render(); toast('Duplicated 💪');
}

function buildExercises(body){
  const search = h('input',{className:'inp', placeholder:'Search exercises or equipment…', value:LIB.q});
  let t = null;
  search.addEventListener('input', ()=>{
    LIB.q = search.value;
    clearTimeout(t);
    t = setTimeout(()=>{ LIB.focusSearch = true; render(); }, 180);
  });
  body.append(h('div',{className:'field', style:{marginTop:'4px'}}, search));
  const mchips = h('div',{className:'chiprow', style:{marginTop:'4px'}});
  MUSCLES.forEach(m=>mchips.append(h('button',{className:'chip'+(LIB.muscle===m?' on':''),
    onClick:()=>{LIB.muscle=m; render();}}, m[0].toUpperCase()+m.slice(1))));
  body.append(mchips);
  const mineChip = h('button',{className:'chip'+(LIB.onlyMine?' on':''), onClick:()=>{LIB.onlyMine=!LIB.onlyMine; render();}},
    LIB.onlyMine?'✓ My equipment only':'Show all equipment');
  body.append(h('div',{className:'chiprow'}, mineChip,
    h('button',{className:'chip', onClick:settingsSheet},'⚙︎ My equipment: '+(
      !db.equipment.length ? 'bodyweight only'
        : db.equipment.length<=3 ? db.equipment.join(', ')
        : db.equipment.length+' types'))));
  const have = new Set(db.equipment);
  const canDo = ex => ex.equip.length===0 || ex.equip.some(q=>have.has(q));
  const ql = LIB.q.trim().toLowerCase();
  let list = EXERCISES.filter(ex=>LIB.muscle==='all'||ex.muscle===LIB.muscle);
  if(ql) list = list.filter(ex=>ex.name.toLowerCase().includes(ql)
    || ex.equip.some(q=>q.includes(ql))
    || (!ex.equip.length && 'bodyweight'.includes(ql)));
  const card = h('div',{className:'card'});
  let shown = 0, lastMuscle = null;
  const heads = LIB.muscle === 'all';   // one chip active = one group, heading is noise
  for(const ex of list){
    const ok = canDo(ex);
    if(LIB.onlyMine && !ok) continue;
    if(heads && ex.muscle !== lastMuscle){
      card.append(h('div',{className:'ex-head'}, ex.muscle));
      lastMuscle = ex.muscle;
    }
    card.append(h('div',{className:'ex-item'+(ok?'':' blocked'), onClick:()=>exerciseSheet(ex)},
      h('div',{},
        h('div',{className:'en'},ex.name),
        h('div',{className:'eq'}, ex.equip.length ? ex.equip.join(' / ') : 'bodyweight'),
        (!ok && ex.sub) ? h('div',{className:'sub'},'↳ try instead: '+ex.sub) : null),
      h('span',{className:'mus'},ex.muscle)));
    shown++;
  }
  if(!shown) card.append(h('div',{className:'empty'},'Nothing here for this filter.'));
  body.append(h('div',{className:'meta', style:{margin:'10px 0 0'}},
    shown+' of '+EXERCISES.length+' moves'));
  if(LIB.focusSearch){
    LIB.focusSearch = false;
    setTimeout(()=>{ search.focus(); const n=search.value.length; search.setSelectionRange(n,n); },0);
  }
  body.append(card);
}
function buildAsk(body){
  body.append(
    h('div',{className:'sl', style:{marginTop:'4px'}},'Your AI coach'),
    h('div',{className:'card'}, h('div',{style:{fontSize:'13.5px', lineHeight:1.6, padding:'6px 0'}},
      'Ask Claude for custom meal plans, dietary advice, workout programming, exercise substitutions — anything fitness. It knows your equipment and your recent training.')),
    h('button',{className:'cta', onClick:()=>{STATE.tab='coach'; render();}},'OPEN COACH 💬'));

/* ── Coach (Claude) ────────────────────────────────────────────────── */
const COACH_MODEL = 'claude-opus-4-8';
function coachSystemPrompt(){
  const recent = db.logs.slice(-6).map(l=>`${l.date}: ${l.name}`).join('; ') || 'none yet';
  const sched = db.schedule.slice(0,8).map(e=>{ const w=getWorkout(e.workoutId); return (w?w.name:'?')+' ('+recurLabel(e)+')'; }).join('; ') || 'nothing scheduled';
  return `You are Brologue Coach — a warm, motivating, no-nonsense fitness and nutrition coach inside the Brologue workout app. Give practical, specific, safe advice on training, meal plans, and diet. Use short sections and bullet lists; keep answers tight and actionable; plain text only (no markdown tables). Add a brief note to consult a professional for medical issues when relevant.
User context — available equipment: ${db.equipment.length?db.equipment.join(', '):'bodyweight only'}. Current schedule: ${sched}. Recent completed workouts: ${recent}. Current streak: ${streakCount()} days.`;
}
const DEMO_REPLIES = [
  [/meal|diet|eat|nutrition|food|protein|cut|bulk/i,
`Here's a simple day of eating for muscle gain (~2,600 kcal):

• Breakfast — 3 eggs + oats with banana & peanut butter
• Lunch — chicken breast, rice, mixed veg, olive oil
• Snack — Greek yogurt + berries + handful of almonds
• Dinner — salmon or lean beef, potatoes, big salad
• Before bed — cottage cheese or a casein shake

Aim for ~1.6–2.2 g protein per kg bodyweight and drink 2–3 L of water. Adjust portions up or down based on how your weight trends over 2 weeks.`],
  [/substitut|replace|instead|alternative/i,
`Great question. Rules of thumb for substitutions:

• Match the movement pattern (push, pull, hinge, squat, carry)
• Barbell bench → dumbbell bench or push-ups
• Lat pulldown → pull-ups or band rows
• Leg press → goblet squats or lunges

Check the Library tab — exercises you can't do with your equipment show a suggested swap automatically.`],
  [/rest|recover|sore|sleep|pain/i,
`Recovery is where the gains happen:

• Sleep 7–9 hours — non-negotiable
• Keep 48h between hitting the same muscle group hard
• Light walking or stretching on rest days beats total inactivity
• Persistent sharp pain ≠ soreness — see a physio for that

Your streak counts rest days as part of the plan, so don't fear them.`],
  [/.*/,
`Here's my take:

• Train each muscle 2× per week for best growth
• Progressive overload: add a rep or 2.5 kg whenever you hit your target
• Compound lifts first, isolation after
• Consistency beats intensity — 3 good sessions every week wins

Want a custom meal plan or a tweak to your current split? Just ask. (Add your Anthropic API key in Settings ⚙︎ for real, personalised answers from Claude.)`],
];
async function askClaude(history){
  const key = db.apiKey;
  if(!key){
    await new Promise(r=>setTimeout(r, 700));
    const last = history[history.length-1].content;
    return {demo:true, text: DEMO_REPLIES.find(([re])=>re.test(last))[1]};
  }
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify({
      model: COACH_MODEL,
      max_tokens: 2048,
      system: coachSystemPrompt(),
      messages: history,
    }),
  });
  if(!res.ok){
    let msg = 'API error '+res.status;
    try{ const j = await res.json(); if(j.error && j.error.message) msg = j.error.message; }catch(e){}
    throw new Error(msg);
  }
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n') || '(no reply)';
  return {demo:false, text};
}
function CoachScreen(){
  const wrap = h('div',{className:'screen'});
  wrap.append(h('div',{className:'app-bar'},
    h('div',{className:'title'},'Coach'),
    h('button',{className:'icon-btn', title:'Settings', onClick:settingsSheet},'⚙︎')));
  if(!db.apiKey) wrap.append(h('div',{className:'keynote'},
    '🔑 Demo mode — answers are canned examples. Add your own Anthropic API key in Settings ⚙︎ to chat with the real Claude. Your key stays on this device only.'));
  const chat = h('div',{className:'chat'});
  const hist = db.coach;
  if(!hist.length) chat.append(h('div',{className:'msg bot'},
    "Hey! I'm your Brologue coach. 💪 Ask me for meal plans, dietary advice, workout programming, or exercise swaps — I know what equipment you've got and what you've been training."));
  for(const m of hist){
    const el = h('div',{className:'msg '+(m.role==='user'?'user':'bot')+(m.demo?' demo':'')});
    if(m.demo) el.append(h('span',{className:'demo-tag'},'DEMO REPLY'));
    el.append(m.content);
    chat.append(el);
  }
  const chips = h('div',{className:'chiprow', style:{padding:'0 16px 8px'}},
    [['🍽 Meal plan','Build me a one-day meal plan that fits my training.'],
     ['🥦 Diet advice','Give me 5 practical diet tips for my goals.'],
     ['🏋️ Workout advice','Review my weekly schedule and suggest improvements.'],
     ['🔁 Substitute','Suggest substitutes for exercises I lack equipment for.']]
    .map(([l,q])=>h('button',{className:'chip', onClick:()=>send(q)}, l)));
  const ta = h('textarea',{className:'inp', rows:'1', placeholder:'Ask your coach anything…',
    value: COACH_PREFILL,
    style:{background:'#1d1413'}});
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(ta.value); } });
  const sendBtn = h('button',{className:'send', onClick:()=>send(ta.value)},'➤');
  COACH_PREFILL = '';
  const inputBar = h('div',{className:'coach-input'}, ta, sendBtn);
  async function send(text){
    text = (text||'').trim();
    if(!text || STATE.coachBusy) return;
    ta.value='';
    const hist2 = db.coach;
    hist2.push({role:'user', content:text});
    db.coach = hist2.slice(-24);
    STATE.coachBusy = true; render();
    const chatEl = document.querySelector('.chat');
    if(chatEl){ chatEl.append(h('div',{className:'typing'},'Coach is thinking…')); chatEl.scrollTop = chatEl.scrollHeight; }
    try{
      const apiHist = db.coach.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role, content:m.content}));
      const {demo, text:reply} = await askClaude(apiHist);
      const hist3 = db.coach;
      hist3.push({role:'assistant', content:reply, demo});
      db.coach = hist3.slice(-24);
    }catch(err){
      const hist3 = db.coach;
      hist3.push({role:'assistant', content:'⚠️ '+err.message+'\n\nCheck your API key in Settings, or try again.', demo:false});
      db.coach = hist3.slice(-24);
    }
    STATE.coachBusy = false; render();
    const c2 = document.querySelector('.chat'); if(c2) c2.scrollTop = c2.scrollHeight;
  }
  wrap.append(chat, chips, inputBar);
  setTimeout(()=>{ chat.scrollTop = chat.scrollHeight; },30);
  return wrap;
}

/* ── settings ──────────────────────────────────────────────────────── */
function settingsSheet(){
  const keyInp = h('input',{className:'inp', type:'password', placeholder:'sk-ant-…', value:db.apiKey});
  const eqChips = h('div',{className:'chiprow'});
  const have = new Set(db.equipment);
  EQUIPMENT.forEach(q=>{
    const c = h('button',{className:'chip'+(have.has(q)?' on':''), onClick:e=>{
      e.preventDefault();
      if(have.has(q)) have.delete(q); else have.add(q);
      c.classList.toggle('on');
      db.equipment = [...have];
    }}, q);
    eqChips.append(c);
  });
  const back = sheet(
    h('h3',{},'Settings'),
    h('div',{className:'field'}, h('label',{},'My equipment (bodyweight always counts)'), eqChips),
    h('div',{className:'field'}, h('label',{},'Anthropic API key — for the Claude coach'), keyInp,
      h('div',{className:'meta', style:{marginTop:'6px'}},'Stored only on this device. Get a key at console.anthropic.com. Without one, the coach runs in demo mode.')),
    h('button',{className:'cta', onClick:()=>{ db.apiKey = keyInp.value.trim(); back.remove(); render(); toast('Settings saved'); }},'SAVE'),
    h('button',{className:'cta ghost danger', style:{marginTop:'10px'}, onClick:()=>{
      confirmSheet('Erase all data?','This wipes your schedule, logs, custom workouts and settings on this device. It cannot be undone.','ERASE EVERYTHING',
        ()=>{ localStorage.clear(); location.reload(); });
    }},'RESET ALL DATA'));
}

/* ── PWA: install banner + service worker + splash ─────────────────── */
function showInstallBanner(){
  if(store.get('bl_install_dismissed', false)) return;
  if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!STATE.deferredInstall && !isIOS) return;
  const bar = h('div',{className:'install-bar'},
    h('span',{style:{fontSize:'22px'}},'🔥'),
    h('div',{className:'t'}, isIOS && !STATE.deferredInstall
      ? 'Install Brologue: tap Share, then “Add to Home Screen”.'
      : 'Install Brologue on your phone for the full app experience.'),
    STATE.deferredInstall ? h('button',{className:'go', onClick:async()=>{
        bar.remove(); STATE.deferredInstall.prompt();
        await STATE.deferredInstall.userChoice; STATE.deferredInstall=null;
      }},'INSTALL') : null,
    h('button',{className:'icon-btn', onClick:()=>{ bar.remove(); store.set('bl_install_dismissed', true); }},'✕'));
  document.body.append(bar);
}
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  STATE.deferredInstall = e;
  showInstallBanner();
});

function boot(){
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if(standalone){
    const sp = document.getElementById('splash');
    sp.style.display = 'flex';
    setTimeout(()=>{ sp.style.display='none'; }, 900);
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  render();
  setTimeout(showInstallBanner, 2500);
}
boot();
